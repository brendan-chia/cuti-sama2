appId: com.cutisama2.app
name: Create, restore, and open a Trip Quest
---
- launchApp:
    clearState: true
- assertVisible: "The group trip that finally leaves the chat."
- tapOn: "Start a group trip"
- assertVisible: "ONE CREW. FIVE LITTLE CHAPTERS."
- tapOn: "Trip name"
- inputText: "Langkawi long weekend"
- hideKeyboard
- tapOn: "Create our Trip Room"
- extendedWaitUntil:
    visible: "TRIP LOBBY"
    timeout: 15000
- stopApp
- launchApp
- assertVisible: "Continue your Trip Room"
- tapOn: "Continue your Trip Room"
- extendedWaitUntil:
    visible: "Langkawi long weekend"
    timeout: 10000
- tapOn: "I’m ready"
- tapOn: "Start planning"
- extendedWaitUntil:
    visible: "Enter our trip quest"
    timeout: 10000
- tapOn: "Enter our trip quest"
- extendedWaitUntil:
    visible: "Find your window."
    timeout: 15000
- assertVisible: "When could you get away?"
