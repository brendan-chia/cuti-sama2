project_id = "cutisama2"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "cutisama2://"
additional_redirect_urls = ["exp://127.0.0.1:8081"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true
enable_manual_linking = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[functions.create-trip]
verify_jwt = true

[functions.manage-invite]
verify_jwt = true

[functions.resolve-invite]
verify_jwt = true

[functions.join-trip]
verify_jwt = true

[functions.group-match]
verify_jwt = true

[functions.suggest-trip-period]
verify_jwt = true

[functions.recommend-destinations]
verify_jwt = true

[functions.submit-vote]
verify_jwt = true

[functions.close-vote]
verify_jwt = true

[functions.lock-destination]
verify_jwt = true

[functions.generate-itinerary]
verify_jwt = true

[functions.revise-itinerary]
verify_jwt = true

[functions.activate-itinerary]
verify_jwt = true

[functions.import-trip-places]
verify_jwt = true

[functions.video-import]
verify_jwt = true

[functions.video-import-worker]
verify_jwt = false

[functions.analyze-inspiration]
verify_jwt = true

[functions.recommend-budget]
verify_jwt = true

[functions.recommend-logistics]
verify_jwt = true
